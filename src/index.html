<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFlow Manager - Módulo de Inventario</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f8; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #2c3e50; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 95%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #27ae60; color: white; padding: 10px 15px; border: none; border-radius: 4px; margin-top: 15px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #219150; }
        .mensaje { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .exito { background-color: #d4edda; color: #155724; display: block; }
        .error { background-color: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>

    <div class="card">
        <h2>BookFlow Manager - Punto de Venta (POS)</h2>
        <p>Módulo de registro y salida de inventario</p>
        
        <label for="titulo">Título del Libro:</label>
        <input type="text" id="titulo" value="Cien Años de Soledad">

        <label for="disponible">Stock Disponible:</label>
        <input type="number" id="disponible" value="10">

        <label for="solicitada">Cantidad a Vender:</label>
        <input type="number" id="solicitada" placeholder="Ingrese cantidad">

        <button onclick="ejecutarVenta()">Procesar Venta</button>

        <div id="resultado" class="mensaje"></div>
    </div>

    <script>
        // Conexión con la lógica de validarVentaLibro
        function validarVentaLibro(titulo, cantidadDisponible, cantidadSolicitada) {
            if (cantidadSolicitada <= 0) {
                return { exito: false, mensaje: "La cantidad solicitada debe ser mayor a cero" };
            }
            if (cantidadSolicitada > cantidadDisponible) {
                return { exito: false, mensaje: "Stock insuficiente" };
            }
            return {
                exito: true,
                nuevoStock: cantidadDisponible - cantidadSolicitada,
                mensaje: "Venta realizada con éxito"
            };
        }

        function ejecutarVenta() {
            const titulo = document.getElementById('titulo').value;
            const disponible = parseInt(document.getElementById('disponible').value);
            const solicitada = parseInt(document.getElementById('solicitada').value);
            const box = document.getElementById('resultado');

            const res = validarVentaLibro(titulo, disponible, solicitada);

            if (res.exito) {
                box.className = "mensaje exito";
                box.innerHTML = `<strong>Éxito:</strong> ${res.mensaje}. Nuevo stock de "${titulo}": ${res.nuevoStock}`;
                document.getElementById('disponible').value = res.nuevoStock;
            } else {
                box.className = "mensaje error";
                box.innerHTML = `<strong>Error:</strong> ${res.mensaje}`;
            }
        }
    </script>
</body>
</html>
